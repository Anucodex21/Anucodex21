name: Generate Rocket Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Checkout generator repo
        uses: actions/checkout@v4
        with:
          repository: Sushmitadasari/Sushmitadasari
          path: generator

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        working-directory: generator

      - name: Generate rocket animation
        run: node generate.mjs
        working-directory: generator
        env:
          GH_USERNAME: Anucodex21
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Copy rocket SVGs into profile repo
        run: |
          cp generator/dark.svg ./rocket-dark.svg 2>/dev/null || cp generator/dist/dark.svg ./rocket-dark.svg
          cp generator/light.svg ./rocket-light.svg 2>/dev/null || cp generator/dist/light.svg ./rocket-light.svg

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rocket-dark.svg rocket-light.svg
          git diff --staged --quiet || git commit -m "Update rocket animation"
          git push
