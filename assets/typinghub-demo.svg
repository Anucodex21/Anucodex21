<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0a1626"/>
      <stop offset="100%" stop-color="#000308"/>
    </radialGradient>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00fff2" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#00b4ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00b4ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="700" height="380" fill="url(#bg)"/>

  <!-- grid lines -->
  <g stroke="#0d3b4f" stroke-width="1" opacity="0.5">
    <line x1="0" y1="60" x2="700" y2="60"/>
    <line x1="0" y1="320" x2="700" y2="320"/>
    <line x1="90" y1="0" x2="90" y2="380"/>
    <line x1="610" y1="0" x2="610" y2="380"/>
  </g>

  <!-- title -->
  <text x="350" y="38" text-anchor="middle" fill="#00f7ff" font-family="Consolas, monospace" font-size="22" letter-spacing="6" filter="url(#glow)">TYPING HUB</text>

  <!-- outer rotating ring -->
  <g transform-origin="350 190">
    <circle cx="350" cy="190" r="95" fill="none" stroke="#0af0ff" stroke-width="1.5" stroke-dasharray="8 10" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0 350 190" to="360 350 190" dur="14s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g transform-origin="350 190">
    <circle cx="350" cy="190" r="120" fill="none" stroke="#0af0ff" stroke-width="1" stroke-dasharray="2 6" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="360 350 190" to="0 350 190" dur="20s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- iris core -->
  <circle cx="350" cy="190" r="70" fill="url(#iris)">
    <animate attributeName="r" values="60;75;60" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="190" r="14" fill="#e8feff" filter="url(#glow)">
    <animate attributeName="r" values="10;16;10" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- listening text -->
  <text x="350" y="270" text-anchor="middle" fill="#7fffe0" font-family="Consolas, monospace" font-size="14" letter-spacing="3">
    &gt; LISTENING...
    <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" repeatCount="indefinite"/>
  </text>

  <!-- waveform bars -->
  <g fill="#00f7ff">
    <rect x="270" y="300" width="6" height="14"><animate attributeName="height" values="14;40;10;30;14" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="300;280;300;285;300" dur="1s" repeatCount="indefinite"/></rect>
    <rect x="285" y="300" width="6" height="24"><animate attributeName="height" values="24;8;36;16;24" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="295;305;280;300;295" dur="1.1s" repeatCount="indefinite"/></rect>
    <rect x="300" y="300" width="6" height="30"><animate attributeName="height" values="30;12;38;20;30" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="290;300;280;295;290" dur="0.9s" repeatCount="indefinite"/></rect>
    <rect x="315" y="300" width="6" height="18"><animate attributeName="height" values="18;34;14;28;18" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="298;282;300;288;298" dur="1.2s" repeatCount="indefinite"/></rect>
    <rect x="330" y="300" width="6" height="36"><animate attributeName="height" values="36;16;30;10;36" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="280;300;286;302;280" dur="1s" repeatCount="indefinite"/></rect>
    <rect x="345" y="300" width="6" height="20"><animate attributeName="height" values="20;38;12;30;20" dur="1.05s" repeatCount="indefinite"/><animate attributeName="y" values="296;278;300;286;296" dur="1.05s" repeatCount="indefinite"/></rect>
    <rect x="360" y="300" width="6" height="30"><animate attributeName="height" values="30;10;36;18;30" dur="0.95s" repeatCount="indefinite"/><animate attributeName="y" values="290;302;280;294;290" dur="0.95s" repeatCount="indefinite"/></rect>
    <rect x="375" y="300" width="6" height="14"><animate attributeName="height" values="14;32;16;38;14" dur="1.15s" repeatCount="indefinite"/><animate attributeName="y" values="300;284;298;278;300" dur="1.15s" repeatCount="indefinite"/></rect>
    <rect x="390" y="300" width="6" height="26"><animate attributeName="height" values="26;12;34;20;26" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="292;302;282;294;292" dur="1.3s" repeatCount="indefinite"/></rect>
    <rect x="405" y="300" width="6" height="16"><animate attributeName="height" values="16;36;14;28;16" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="298;280;300;288;298" dur="1s" repeatCount="indefinite"/></rect>
  </g>

  <!-- status bar -->
  <text x="20" y="360" fill="#3ad1c9" font-family="Consolas, monospace" font-size="12">STATUS: ACTIVE</text>
  <text x="600" y="360" text-anchor="end" fill="#3ad1c9" font-family="Consolas, monospace" font-size="12">MODE: VOICE-TO-TEXT</text>

  <!-- corner brackets -->
  <g stroke="#00f7ff" stroke-width="2" fill="none" opacity="0.8">
    <path d="M20 20 L20 45 M20 20 L45 20"/>
    <path d="M680 20 L680 45 M680 20 L655 20"/>
    <path d="M20 340 L20 365 M20 365 L45 365"/>
    <path d="M680 340 L680 365 M680 365 L655 365"/>
  </g>
</svg>
